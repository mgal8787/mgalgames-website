<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MG Games - Coming Soon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 44px;
    }

    /* Logo */
    #logo {
      width: 320px;
      height: 320px;
      opacity: 0;
      position: relative;
    }
    #logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Coming Soon */
    #cs {
      opacity: 0;
      transform: translateY(24px);
      font-size: clamp(22px, 3.5vw, 46px);
      font-weight: 800;
      letter-spacing: 10px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 12px #00bfff, 0 0 28px #00bfff, 0 0 55px #0070ff;
    }

    /* Social icons */
    #soc {
      display: flex;
      gap: 18px;
      opacity: 0;
    }

    .soc-link {
      width: 48px;
      height: 48px;
      border: 1.5px solid #00bfff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 0 8px #00bfff33;
      transition: all 0.3s;
    }
    .soc-link:hover {
      border-color: #00ffff;
      box-shadow: 0 0 20px #00bfff, 0 0 45px #0070ff;
      transform: translateY(-4px);
    }
    .soc-link svg { width: 22px; height: 22px; fill: #00bfff; transition: fill 0.3s; }
    .soc-link:hover svg { fill: #00ffff; }

    /* Footer */
    footer {
      position: fixed;
      bottom: 18px;
      opacity: 0;
      color: #00bfff66;
      font-size: 12px;
      letter-spacing: 5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<canvas id="c"></canvas>

<div class="content">

  <div id="logo">
    <img src="logo.png" alt="MG Games">
  </div>

  <div id="cs">Coming Soon</div>

  <div id="soc">
    <!-- TikTok -->
    <a href="https://www.tiktok.com/@mgalgames" class="soc-link" target="_blank">
      <svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.27 6.27 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.78a4.85 4.85 0 0 1-1.01-.09z"/></svg>
    </a>
    <!-- Instagram -->
    <a href="https://www.instagram.com/mgalgames" class="soc-link" target="_blank">
      <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>
    </a>
    <!-- YouTube -->
    <a href="https://www.youtube.com/@mgalgames" class="soc-link" target="_blank">
      <svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31.2 31.2 0 0 0 0 12a31.2 31.2 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31.2 31.2 0 0 0 24 12a31.2 31.2 0 0 0-.5-5.8zM9.7 15.5V8.5L15.8 12z"/></svg>
    </a>
    <!-- Facebook -->
    <a href="https://www.facebook.com/mgalgames" class="soc-link" target="_blank">
      <svg viewBox="0 0 24 24"><path d="M24 12.1C24 5.4 18.6 0 12 0S0 5.4 0 12.1C0 18.1 4.4 23.1 10.1 24v-8.4H7.1v-3.5h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3H15.8c-1.5 0-2 .9-2 1.9v2.2h3.3l-.5 3.5h-2.8V24C19.6 23.1 24 18.1 24 12.1z"/></svg>
    </a>
  </div>

</div>

<footer id="footer">© 2026 MGAL GAMES</footer>

<script>
// ── Canvas setup ──────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || window.innerWidth < 768;
const SHADOW = isMobile ? 0 : 22;
const SHADOW_SMALL = isMobile ? 0 : 18;
const PARTICLE_COUNT = isMobile ? 14 : 28;
const BOLT_ROUGHNESS = isMobile ? 35 : 55;

function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

function lerp(a, b, t) { return a + (b - a) * t; }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeOutExpo(t) { return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); }
function rand(a, b) { return a + Math.random() * (b - a); }

// ── Lightning bolt (recursive midpoint displacement) ──────────
function drawBolt(x1, y1, x2, y2, roughness, alpha) {
  if (roughness < 3) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    return;
  }
  const mx = (x1 + x2) / 2 + rand(-roughness, roughness);
  const my = (y1 + y2) / 2 + rand(-roughness, roughness);
  drawBolt(x1, y1, mx, my, roughness * 0.55, alpha);
  drawBolt(mx, my, x2, y2, roughness * 0.55, alpha);
}

// ── Active bolts pool ─────────────────────────────────────────
let bolts = [];
function spawnBolt(near) {
  const cx = W / 2, cy = H / 2;
  const angle = Math.random() * Math.PI * 2;
  const dist = near ? rand(80, 220) : rand(220, Math.max(W, H) * 0.7);
  bolts.push({
    x1: cx + Math.cos(angle) * dist,
    y1: cy + Math.sin(angle) * dist,
    x2: cx + rand(-80, 80),
    y2: cy + rand(-80, 80),
    life: 1.0,
    decay: rand(0.04, 0.08)
  });
}

// ── Flying particles ──────────────────────────────────────────
let particles = [];
function spawnParticles() {
  const cx = W / 2, cy = H / 2;
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const angle = rand(0, Math.PI * 2);
    const dist = rand(180, Math.min(W, H) * 0.55);
    particles.push({
      x: cx + Math.cos(angle) * dist,
      y: cy + Math.sin(angle) * dist,
      tx: cx + rand(-30, 30),
      ty: cy + rand(-30, 30),
      t: 0,
      speed: rand(0.018, 0.035),
      size: rand(2, 5),
      color: Math.random() > 0.4 ? '#00cfff' : '#ffffff'
    });
  }
}

// ── Logo reveal ───────────────────────────────────────────────
let logoRevealed = false;
function revealLogo() {
  if (logoRevealed) return;
  logoRevealed = true;
  particles = [];

  // Burst of bolts
  for (let i = 0; i < 24; i++) {
    setTimeout(() => spawnBolt(true), i * 35);
  }

  // Show logo with flash
  const logo = document.getElementById('logo');
  logo.style.transition = 'opacity 0.08s';
  logo.style.opacity = '1';
  logo.style.filter = 'drop-shadow(0 0 50px #ffffff) drop-shadow(0 0 80px #00ffff) brightness(2)';

  setTimeout(() => {
    logo.style.transition = 'filter 0.6s ease-out';
    logo.style.filter = 'drop-shadow(0 0 18px #00bfff) drop-shadow(0 0 40px #0060ff)';
    startLogoPulse();
  }, 120);

  // Coming Soon
  setTimeout(() => {
    const cs = document.getElementById('cs');
    cs.style.transition = 'opacity 1s ease, transform 1s ease';
    cs.style.opacity = '1';
    cs.style.transform = 'translateY(0)';
    startTextPulse();
  }, 1100);

  // Social icons
  setTimeout(() => {
    document.getElementById('soc').style.transition = 'opacity 1s';
    document.getElementById('soc').style.opacity = '1';
  }, 2000);

  // Footer
  setTimeout(() => {
    document.getElementById('footer').style.transition = 'opacity 1s';
    document.getElementById('footer').style.opacity = '1';
  }, 2600);

  // Ongoing ambient bolts
  setInterval(() => { if (Math.random() < 0.45) spawnBolt(true); }, 700);
}

// ── Logo glow pulse ───────────────────────────────────────────
function startLogoPulse() {
  const logo = document.getElementById('logo');
  let up = true;
  setInterval(() => {
    up = !up;
    logo.style.transition = 'filter 1.2s ease-in-out';
    logo.style.filter = up
      ? 'drop-shadow(0 0 28px #00ffff) drop-shadow(0 0 55px #00bfff) drop-shadow(0 0 90px #0060ff)'
      : 'drop-shadow(0 0 10px #00bfff) drop-shadow(0 0 25px #0050ff)';
  }, 1800);
}

// ── Coming Soon text pulse ────────────────────────────────────
function startTextPulse() {
  const cs = document.getElementById('cs');
  let up = true;
  setInterval(() => {
    up = !up;
    cs.style.transition = 'text-shadow 1.2s ease-in-out';
    cs.style.textShadow = up
      ? '0 0 22px #00ffff, 0 0 45px #00bfff, 0 0 90px #0070ff'
      : '0 0 10px #00bfff, 0 0 25px #00bfff, 0 0 50px #0060ff';
  }, 2000);
}

// ── Main draw loop ────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);

  // Particles flying to center
  let allDone = particles.length > 0;
  particles.forEach(p => {
    p.t = Math.min(1, p.t + p.speed);
    const e = easeOutExpo(p.t);
    const px = lerp(p.x, p.tx, e);
    const py = lerp(p.y, p.ty, e);
    if (p.t < 1) allDone = false;

    ctx.beginPath();
    ctx.arc(px, py, p.size, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.shadowBlur = SHADOW_SMALL;
    ctx.shadowColor = '#00bfff';
    ctx.globalAlpha = 1 - p.t * 0.3;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  });

  // When particles converge → reveal logo
  if (allDone && particles.length > 0) revealLogo();

  // Lightning bolts
  bolts = bolts.filter(b => b.life > 0);
  bolts.forEach(b => {
    ctx.globalAlpha = b.life;
    ctx.strokeStyle = b.life > 0.6 ? '#ffffff' : '#00cfff';
    ctx.lineWidth = b.life * 1.8;
    ctx.shadowBlur = SHADOW;
    ctx.shadowColor = '#00bfff';
    drawBolt(b.x1, b.y1, b.x2, b.y2, BOLT_ROUGHNESS, b.life);
    ctx.shadowBlur = 0;
    b.life -= b.decay;
  });
  ctx.globalAlpha = 1;

  requestAnimationFrame(draw);
}

// ── Start ─────────────────────────────────────────────────────
draw();
setTimeout(spawnParticles, 400);
</script>
</body>
</html>
